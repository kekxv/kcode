name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install Chromium for end-to-end tests
        id: playwright
        run: npx playwright install --with-deps chromium
      - name: Verify, test, scan, and package
        id: verify
        run: |
          set +e
          NO_COLOR=1 FORCE_COLOR=0 sh -c 'npm run verify && npm run assets:verify:deep' 2>&1 | tee verify.log
          verify_status=${PIPESTATUS[0]}
          echo "exit_code=$verify_status" >> "$GITHUB_OUTPUT"
          exit "$verify_status"
      - name: Write workflow summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          {
            echo '## kcode CI/CD summary'
            echo
            if [ "$VERIFY_OUTCOME" = success ]; then
              echo '> PASS: verification, security scans, build, and end-to-end tests passed.'
            else
              echo "> FAIL: verification exited with code $VERIFY_EXIT_CODE. A sanitized diagnostic excerpt follows."
            fi
            echo
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Dependency install | $INSTALL_OUTCOME |"
            echo "| Playwright Chromium | $PLAYWRIGHT_OUTCOME |"
            echo "| Full verification | $VERIFY_OUTCOME |"
            echo
            if [ "$VERIFY_OUTCOME" != success ]; then
              echo '### Failure diagnosis'
              if [ -s verify.log ]; then
                clean_log=$(mktemp)
                sed -E $'s/\x1B\[[0-?]*[ -/]*[@-~]//g' verify.log > "$clean_log"
                echo '```text'
                asset_diagnostic=$(awk '/VM asset verification failed:/{remaining=24} remaining > 0 {print; remaining--}' "$clean_log")
                if [ -n "$asset_diagnostic" ]; then
                  printf '%s\n' "$asset_diagnostic"
                else
                  matches=$(grep -Ei '(^ FAIL |AssertionError|Error:|security .*failed|Test Files|Tests .*failed|[0-9]+ failed)' "$clean_log" | tail -n 80 || true)
                  if [ -n "$matches" ]; then
                    printf '%s\n' "$matches"
                  else
                    tail -n 80 "$clean_log"
                  fi
                fi
                rm -f "$clean_log"
                echo '```'
              else
                echo '_verify.log was not created; inspect the Verify step output._'
              fi
              echo
            fi
            echo '### Build output'
            if [ -d dist ]; then
              echo '```text'
              du -sh dist
              find dist -maxdepth 2 -type f -printf '%p\n' | sort
              echo '```'
            else
              echo '_No `dist/` directory was produced._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extension package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kcode-extension
          path: dist/
          if-no-files-found: error
